{% extends "base.html" %}
{% block title %}Profil — {{ site_name }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="fw-bold mb-4">Profil</h2>
        <form method="post" enctype="multipart/form-data" class="evtap-form">
            {% csrf_token %}
            {% for field in form %}
            <div class="mb-3">
                <label class="form-label">{{ field.label }}</label>
                {{ field }}
            </div>
            {% endfor %}
            <button type="submit" class="btn btn-evtap-accent w-100">Yadda saxla</button>
        </form>
    </div>
</div>
{% endblock %}
